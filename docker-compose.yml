# Optional Neo4j backend for MediGuard.
# The project runs WITHOUT this using the default embedded NetworkX KG backend.
# Use this only if you set MEDIGUARD_KG_BACKEND=neo4j and have Docker installed.
#
#   docker compose up -d
#   Browser UI: http://localhost:7474  (user: neo4j / pass: mediguard)
#
services:
  neo4j:
    image: neo4j:5.20-community
    container_name: mediguard-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/mediguard
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
